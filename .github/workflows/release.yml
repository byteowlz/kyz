# kyz releases via the shared byteowlz reusable workflow (ADR-0021).
# It builds linux-gnu (glibc floor) in the byt container + macOS natively, then
# publishes the GitHub release with checksums.txt. All release config lives in
# byt.release.toml. byt has no Windows packaging, so the windows job adds the
# Windows archive in the same layout and appends its checksum.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v1.2.3)
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
      packages: read
    uses: byteowlz/byt/.github/workflows/release.yml@main
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}

  windows:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: x86_64-pc-windows-msvc
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build
        run: cargo build --locked --release --target "$TARGET" --bins

      - name: Package ({name}-v{version}-{triple}/bin/)
        run: |
          stage="kyz-${RELEASE_TAG}-${TARGET}"
          mkdir -p "$stage/bin"
          for bin in kyz kyz-api kyz-mcp kyz-tui; do
            cp "target/$TARGET/release/$bin.exe" "$stage/bin/"
          done
          cp LICENSE README.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          test "$("$stage/bin/kyz.exe" --version)" = "kyz-cli ${RELEASE_TAG#v}"

      - name: Upload archive and append checksum
        run: |
          archive="kyz-${RELEASE_TAG}-${TARGET}.tar.gz"
          gh release upload "$RELEASE_TAG" "$archive"
          gh release download "$RELEASE_TAG" --pattern checksums.txt --dir published
          {
            grep -v "  $archive\$" published/checksums.txt || true
            # Explicit two-space format; MSYS sha256sum may emit a `*` mode marker.
            printf '%s  %s\n' "$(sha256sum "$archive" | cut -d' ' -f1)" "$archive"
          } | sort -k2 > checksums.txt
          gh release upload "$RELEASE_TAG" checksums.txt --clobber
