# Release config consumed by `byt release` (ADR-0021).
#
# The reusable workflow builds linux-gnu in the byt container (glibc floor) and
# *-apple-darwin natively on a macOS runner, then combines + publishes. byt has
# no Windows packaging, so release.yml adds the Windows archive and checksum.
# No Homebrew/AUR sections: downstream publishing is not set up yet.
[release]
name = "kyz"
lang = "rust"
bins = ["kyz", "kyz-api", "kyz-mcp", "kyz-tui"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
