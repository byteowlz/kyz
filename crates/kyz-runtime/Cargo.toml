[package]
name = "kyz-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-level library integration surface for kyz - open vaults, resolve refs, inspect SSH identities"

[lints]
workspace = true

[dependencies]
kyz-core.workspace = true
thiserror.workspace = true
secrecy.workspace = true
log.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "p256", "p384", "p521"] }

[dev-dependencies]
tempfile.workspace = true
# Enables `kyz_core::paths::isolate_state_dir` for the integration
# tests: v4 writes allocate op ids through the global actor-state
# directory, and tests must not touch the developer's real
# actor-state.json or contend with a running `kyz` for its lock.
kyz-core = { workspace = true, features = ["test-util"] }
