"$schema" = "https://raw.githubusercontent.com/byteowlz/schemas/refs/heads/main/kyz/kyz.config.schema.json"

# Configuration for kyz.
# Copy this file to $XDG_CONFIG_HOME/kyz/config.toml and adjust as needed.

profile = "default"
history_retention = 10

[logging]
level = "info"

[runtime]
timeout = 60
fail_fast = true

[paths]

[daemon]
timeout_secs = 0
max_in_flight = 32
request_body_limit_bytes = 10485760
response_body_limit_bytes = 20971520

[proxy]
auth = "token"
